suite: webshell_detection
rules_path: ../../rules/webshell-detection.yaml
tests:
  # ── PHP in web root ────────────────────────────────────────────────────────
  - name: "PHP file in /var/www/html/ fires webshell_php_in_web_root"
    rule_id: webshell_php_in_web_root
    event:
      type: file
      comm: curl
      file:
        filename: "/var/www/html/shell.php"
        op: write
    expect: alert
    expect_severity: critical
    mutants:
      # issue #31: this rule keys on path+extension only and never consults
      # comm, so a web-shell dropper that spoofs comm to the web server
      # process is still caught.
      - description: "comm spoofed to nginx (rule keys on path+extension, still fires)"
        patch:
          comm: nginx
        expect: alert

  - name: "PHP file in /var/www/ fires webshell_php_in_web_root"
    rule_id: webshell_php_in_web_root
    event:
      type: file
      comm: python3
      file:
        filename: "/var/www/uploads/c99.php"
        op: create
    expect: alert
    expect_severity: critical

  - name: "PHP file in /srv/www/ fires webshell_php_in_web_root"
    rule_id: webshell_php_in_web_root
    event:
      type: file
      comm: wget
      file:
        filename: "/srv/www/app/r57.php"
        op: write
    expect: alert

  - name: "PHP file in /usr/share/nginx/html/ fires webshell_php_in_web_root"
    rule_id: webshell_php_in_web_root
    event:
      type: file
      comm: nc
      file:
        filename: "/usr/share/nginx/html/backdoor.php"
        op: create
    expect: alert

  # ── JSP in web app dir ────────────────────────────────────────────────────
  - name: "JSP file in Tomcat webapps fires webshell_jsp_in_web_root"
    rule_id: webshell_jsp_in_web_root
    event:
      type: file
      comm: java
      file:
        filename: "/opt/tomcat/webapps/ROOT/cmd.jsp"
        op: write
    expect: alert
    expect_severity: critical
    mutants:
      # issue #31: path+extension only; comm spoof to the web server does
      # not evade.
      - description: "comm spoofed to nginx (rule keys on path+extension, still fires)"
        patch:
          comm: nginx
        expect: alert

  - name: "JSP file in JBoss fires webshell_jsp_in_web_root"
    rule_id: webshell_jsp_in_web_root
    event:
      type: file
      comm: bash
      file:
        filename: "/opt/jboss/standalone/deployments/evil.jsp"
        op: create
    expect: alert

  # ── ASP/ASPX on Linux ────────────────────────────────────────────────────
  - name: "ASPX file in /var/www/ fires webshell_asp_written"
    rule_id: webshell_asp_written
    event:
      type: file
      comm: curl
      file:
        filename: "/var/www/html/shell.aspx"
        op: create
    expect: alert
    expect_severity: critical
    mutants:
      # issue #31: path+extension only; comm spoof does not evade.
      - description: "comm spoofed to nginx (rule keys on path+extension, still fires)"
        patch:
          comm: nginx
        expect: alert

  - name: "ASP file in /srv/www/ fires webshell_asp_written"
    rule_id: webshell_asp_written
    event:
      type: file
      comm: wget
      file:
        filename: "/srv/www/app/backdoor.asp"
        op: write
    expect: alert

  # ── Script file via web process ───────────────────────────────────────────
  - name: "any .sh file creation fires webshell_script_write_via_web_process"
    rule_id: webshell_script_write_via_web_process
    event:
      type: file
      comm: apache2
      file:
        filename: "/var/www/html/run.sh"
        op: create
    expect: alert
    expect_severity: critical
    mutants:
      # issue #31: comm is a positive match on the web-server list; spoofing
      # to another allowlisted web server (nginx) keeps detection...
      - description: "comm spoofed to nginx (still a web server, still fires)"
        patch:
          comm: nginx
        expect: alert
      # ...but spoofing comm to a non-web legitimate process evades.
      - description: "comm spoofed to systemd (non-web process, evades)"
        patch:
          comm: systemd
        expect: no_alert
        known_bypass: true

  - name: ".phtml file creation fires webshell_script_write_via_web_process"
    rule_id: webshell_script_write_via_web_process
    event:
      type: file
      comm: nginx
      file:
        filename: "/var/www/html/info.phtml"
        op: write
    expect: alert

  - name: ".cgi file creation fires webshell_script_write_via_web_process"
    rule_id: webshell_script_write_via_web_process
    event:
      type: file
      comm: httpd
      file:
        filename: "/var/www/cgi-bin/evil.cgi"
        op: create
    expect: alert

  # ── Common web shell filenames ────────────────────────────────────────────
  - name: "known web shell filename fires webshell_common_filename"
    rule_id: webshell_common_filename
    event:
      type: file
      comm: curl
      file:
        filename: "/var/www/html/c99.php"
        op: write
    expect: alert
    expect_severity: critical
    mutants:
      # issue #31: filename-contains match only; comm spoof does not evade.
      - description: "comm spoofed to nginx (rule keys on filename, still fires)"
        patch:
          comm: nginx
        expect: alert

  # ── Negative cases ────────────────────────────────────────────────────────
  - name: "writing a CSS file does not fire any webshell rule"
    rule_id: webshell_php_in_web_root
    event:
      type: file
      comm: nginx
      file:
        filename: "/var/www/html/style.css"
        op: write
    expect: no_alert

  - name: "writing a JS file does not fire any webshell rule"
    rule_id: webshell_common_filename
    event:
      type: file
      comm: node
      file:
        filename: "/var/www/html/app.js"
        op: write
    expect: no_alert

  - name: "Java source under Tomcat webapps does not fire JSP rule"
    rule_id: webshell_jsp_in_web_root
    event:
      type: file
      comm: java
      file:
        filename: "/opt/tomcat/webapps/ROOT/HealthServlet.java"
        op: write
    expect: no_alert

  - name: "HTML file under /srv/www does not fire ASP rule"
    rule_id: webshell_asp_written
    event:
      type: file
      comm: nginx
      file:
        filename: "/srv/www/app/index.html"
        op: write
    expect: no_alert

  - name: "web server writing a JS asset does not fire script-write rule"
    rule_id: webshell_script_write_via_web_process
    event:
      type: file
      comm: nginx
      file:
        filename: "/var/www/html/app.js"
        op: write
    expect: no_alert
