suite: exfiltration_extended
rules_path: ../../rules/exfiltration-extended.yaml
tests:
  # ── Large HTTP POST to non-standard port ──────────────────────────────────
  - name: "connection to port 4444 fires exfil_large_http_post"
    rule_id: exfil_large_http_post
    event:
      type: network
      comm: malware
      network:
        dst_ip: "1.2.3.4"
        dport: 4444
    expect: alert

  - name: "connection to port 31337 fires exfil_large_http_post (elite port)"
    rule_id: exfil_large_http_post
    event:
      type: network
      comm: implant
      network:
        dst_ip: "185.220.101.2"
        dport: 31337
    expect: alert

  - name: "connection to port 8080 fires exfil_large_http_post"
    rule_id: exfil_large_http_post
    event:
      type: network
      comm: exfiltrator
      network:
        dst_ip: "192.168.1.200"
        dport: 8080
    expect: alert

  - name: "connection to port 1337 fires exfil_large_http_post"
    rule_id: exfil_large_http_post
    event:
      type: network
      comm: beacon
      network:
        dst_ip: "10.0.0.5"
        dport: 1337
    expect: alert

  - name: "connection to port 6666 fires exfil_large_http_post"
    rule_id: exfil_large_http_post
    event:
      type: network
      comm: c2client
      network:
        dst_ip: "185.220.101.1"
        dport: 6666
    expect: alert

  - name: "HTTPS to port 443 does not fire exfil rule"
    rule_id: exfil_large_http_post
    event:
      type: network
      comm: curl
      network:
        dst_ip: "93.184.216.34"
        dport: 443
    expect: no_alert

  - name: "connection to port 80 does not fire exfil rule"
    event:
      type: network
      comm: wget
      network:
        dst_ip: "93.184.216.34"
        dport: 80
    expect: no_alert

  - name: "SSH to port 22 does not fire exfil rule"
    event:
      type: network
      comm: ssh
      network:
        dst_ip: "10.0.0.5"
        dport: 22
    expect: no_alert

  # ── Negative DNS case ────────────────────────────────────────────────────
  - name: "short DNS query does not fire high-entropy exfil rule"
    event:
      type: dns
      comm: curl
      dns:
        qname: "api.example.com"
        qtype: 1
    expect: no_alert

  # ── DNS entropy / DGA scoring (issue #30: encoding/obfuscation bypass) ─────
  - name: "high-entropy random-looking label fires exfil_dns_high_entropy_qname"
    rule_id: exfil_dns_high_entropy_qname
    event:
      type: dns
      comm: implant
      dns:
        qname: "w8uo9b4kfel3guxn.exfil.evil.io"
        qtype: 1
    expect: alert

  - name: "digit-heavy DGA-scored label fires exfil_dns_high_entropy_qname"
    rule_id: exfil_dns_high_entropy_qname
    event:
      type: dns
      comm: implant
      dns:
        qname: "a8f3c9d21b.c2.example.io"
        qtype: 1
    expect: alert

  - name: "known gap: plaintext data fragmented into low-entropy DNS labels evades the entropy/DGA rule"
    # Documents a real detection gap (issue #30): the rule only scores the
    # longest label's Shannon entropy / digit ratio / bigram rarity. Raw
    # exfiltrated ASCII text (no base64/hex encoding) is neither high-entropy
    # nor digit-heavy, so splitting it across short DNS labels evades this
    # rule entirely, even though the data is being tunneled out via DNS.
    rule_id: exfil_dns_high_entropy_qname
    event:
      type: dns
      comm: implant
      dns:
        qname: "secretdatasecretdata.0.exfil.evil.io"
        qtype: 1
    expect: no_alert
