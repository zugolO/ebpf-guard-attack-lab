rules:
  - id: cred_aws_credentials_read
    name: "AWS Credentials File Access"
    description: "An unexpected process read AWS credential files"
    event_type: 3
    condition_group:
      operator: and
      conditions:
        - field: op
          op: in
          values: [read, open]
        - field: filename
          op: contains
          values: ["/.aws/"]
        - field: comm
          op: not_in
          values: [aws, aws-cli, awscli, terraform, packer]
    severity: warning
    action: alert

  - id: cred_gcp_service_account_read
    name: "GCP Service Account Key Access"
    description: "An unexpected process read a GCP service account key file"
    event_type: 3
    condition_group:
      operator: and
      conditions:
        - field: op
          op: in
          values: [read, open]
        - field: filename
          op: prefix
          values: ["/etc/gcp/", "/etc/google/"]
        - field: comm
          op: not_in
          values: [gcloud, gsutil]
    severity: warning
    action: alert

  - id: cred_ssh_private_key_read
    name: "SSH Private Key Access"
    description: "An unexpected process read an SSH private key"
    event_type: 3
    condition_group:
      operator: and
      conditions:
        - field: op
          op: in
          values: [read, open]
        - field: filename
          op: contains
          values: ["/.ssh/id_"]
        - field: comm
          op: not_in
          values: [ssh, scp, sftp, git, rsync, ansible]
    severity: warning
    action: alert

  - id: cred_shadow_read
    name: "Shadow Password File Read"
    description: "An unexpected process read /etc/shadow"
    event_type: 3
    condition_group:
      operator: and
      conditions:
        - field: op
          op: in
          values: [read, open]
        - field: filename
          op: equals
          values: ["/etc/shadow"]
    severity: critical
    action: alert
