rules:
  - id: persist_systemd_timer_created
    name: "Systemd Timer Unit Created"
    description: "A new systemd timer unit was written, indicating scheduled persistence"
    event_type: 3
    condition_group:
      operator: and
      conditions:
        - field: op
          op: in
          values: [create, write]
        - field: filename
          op: suffix
          values: [".timer"]
        - field: comm
          op: not_in
          values: [apt, dpkg, systemd, systemctl, rpm, yum]
    severity: warning
    action: alert

  - id: persist_systemd_wants_symlink
    name: "Systemd Wants Symlink Created"
    description: "A process created a symlink, possibly to add a service to systemd wants"
    event_type: 1
    condition_group:
      operator: and
      conditions:
        - field: nr
          op: equals
          values: ["88"]
        - field: comm
          op: not_in
          values: [systemctl, systemd, dpkg, apt, apt-get, rpm]
    severity: warning
    action: alert

  - id: persist_profile_d_write
    name: "Shell Profile Hook Written"
    description: "A file was written to /etc/profile.d/, adding a persistent shell hook"
    event_type: 3
    condition_group:
      operator: and
      conditions:
        - field: op
          op: in
          values: [create, write]
        - field: filename
          op: prefix
          values: ["/etc/profile.d/"]
        - field: comm
          op: not_in
          values: [dpkg, apt, apt-get, rpm, yum, snap]
    severity: warning
    action: alert

  - id: persist_etc_environment_write
    name: "Global Environment File Modified"
    description: "/etc/environment was modified to persist environment variable backdoors"
    event_type: 3
    condition_group:
      operator: and
      conditions:
        - field: op
          op: in
          values: [write, create]
        - field: filename
          op: equals
          values: ["/etc/environment"]
    severity: warning
    action: alert

  - id: persist_etc_profile_write
    name: "Global Shell Profile Modified"
    description: "/etc/profile was modified to add a persistent shell hook"
    event_type: 3
    condition_group:
      operator: and
      conditions:
        - field: op
          op: in
          values: [write, create]
        - field: filename
          op: equals
          values: ["/etc/profile"]
    severity: warning
    action: alert
